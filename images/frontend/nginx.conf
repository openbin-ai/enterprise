gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
gzip_min_length 1024;

# OpenBin web app (native binaries, scripts) — proxied from APP_HOST.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html/openbin;
    include /etc/nginx/openbin-common.conf;
}

# OpenAPK web app (Android) — proxied from APK_HOST.
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html/openapk;
    include /etc/nginx/openbin-common.conf;
}
