index index.html;

location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
}

# Install scripts, CLI archives, worker image tarballs, BINNY. Populated
# from the mounted downloads/ directory by the entrypoint (install scripts
# are rewritten to point back at this instance).
location /downloads/ {
    alias /run/openbin/downloads/;
    autoindex on;
    autoindex_exact_size off;
    add_header Cache-Control "no-cache";
}

# Content-hashed bundles never change.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}
